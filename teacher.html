<!DOCTYPE html>
<html>
<head>
  <title>선생님 관리 페이지</title>
  <meta charset="UTF-8">
  <link rel="stylesheet" href="main.css">
</head>
<body>

<header>
  <img src="yunsam.jpeg" alt="img">
</header>

<div class="navbar">
  <a href="teacher.html">학생 인원 관리</a>
  <a href="teacher_hw.html">숙제 관리</a>
  <a href="teacher_announce.html">공지사항 관리</a>
  <a href="teacher_test.html">시험 관리</a>
  <a href="teacher_daily.html">데일리 관리</a>
</div>

<div class="container">
  <div class="main">
    <h2>선생님 회원 관리 페이지</h2>
    <p>회원가입한 학생 정보를 확인할 수 있습니다.</p>
    <hr>

    <h3>회원 관리</h3>

    <div>
      <label>반 선택: </label>
      <select id="filterClass" onchange="loadAllUsers()">
        <option value="">전체 반</option>
        <option value="고3">고3</option>
        <option value="고2 주2회">고2 주2회</option>
        <option value="고2 주1회">고2 주1회</option>
        <option value="고1 주2회">고1 주2회</option>
        <option value="고1 주1회">고1 주1회</option>
        <option value="중3">중3</option>
      </select>
    </div>

    <hr>

    <h3>승인 대기 중인 학생</h3>

    <table border="1">
      <thead>
        <tr>
          <th>번호</th>
          <th>학교</th>
          <th>이름</th>
          <th>반명</th>
          <th>출석코드</th>
          <th>상태</th>
          <th>관리</th>
        </tr>
      </thead>
      <tbody id="pendingUserList"></tbody>
    </table>

    <br>

    <h3>승인 완료 학생</h3>

    <table border="1">
      <thead>
        <tr>
          <th>번호</th>
          <th>학교</th>
          <th>이름</th>
          <th>반명</th>
          <th>출석코드</th>
          <th>상태</th>
          <th>관리</th>
        </tr>
      </thead>
      <tbody id="approvedUserList"></tbody>
    </table>
  </div>
</div>

<h3>학생 계정 직접 추가</h3>

<div class="student-form">
  <input type="text" id="addSchool" placeholder="학교">
  <input type="text" id="addName" placeholder="이름">

  <select id="addClass">
    <option value="고3">고3</option>
    <option value="고2 주2회">고2 주2회</option>
    <option value="고2 주1회">고2 주1회</option>
    <option value="고1 주2회">고1 주2회</option>
    <option value="고1 주1회">고1 주1회</option>
    <option value="중3">중3</option>
  </select>

  <input type="text" id="addUserId" placeholder="출석코드">
  <input type="password" id="addPassword" placeholder="비밀번호">

  <button onclick="addUser()">학생 추가</button>
</div>

<script>
  const loginUser = sessionStorage.getItem("loginUser");

  if (!loginUser) {
    alert("로그인이 필요합니다.");
    location.href = "login.html";
  } else {
    const user = JSON.parse(loginUser);

    if (user.role !== "teacher") {
      alert("관리자만 접근할 수 있습니다.");
      location.href = "yunsam.html";
    }
  }
  function loadAllUsers() {
    loadUsersByStatus("pending", "pendingUserList");
    loadUsersByStatus("approved", "approvedUserList");
  }

  function loadUsersByStatus(status, tbodyId) {
    const filterClass = document.getElementById("filterClass").value;

    let url = "/users?status=" + encodeURIComponent(status);

    if (filterClass) {
      url += "&class=" + encodeURIComponent(filterClass);
    }

    fetch(url)
      .then(response => response.json())
      .then(data => {
        const userList = document.getElementById(tbodyId);
        userList.innerHTML = "";

        if (!data.success) {
          alert(data.message);
          return;
        }

        if (data.users.length === 0) {
          userList.innerHTML = `
            <tr>
              <td colspan="7">해당 학생이 없습니다.</td>
            </tr>
          `;
          return;
        }

        data.users.forEach(user => {
          const statusText =
            user.status === "approved" ? "승인 완료" : "승인 대기";

          const approveButton =
            user.status === "pending"
              ? `<button onclick="approveUser(${user.id})">승인</button>`
              : "";

          userList.innerHTML += `
            <tr>
              <td>${user.id}</td>
              <td>${user.school || ""}</td>
              <td>${user.name || ""}</td>
              <td>${user.user_class || ""}</td>
              <td>${user.user_id || ""}</td>
              <td>${statusText}</td>
              <td>
                ${approveButton}
                <button onclick="deleteUser(${user.id})">삭제</button>
              </td>
            </tr>
          `;
        });
      });
  }

loadAllUsers();
  
  function approveUser(id) {
    fetch("/users/" + id + "/approve", {
      method: "PATCH"
    })
      .then(response => response.json())
      .then(data => {
        alert(data.message);

        if (data.success) {
          loadAllUsers();
        }
      });
  }
  function approveUser(id) {
  fetch("/users/" + id + "/approve", {
    method: "PATCH"
  })
    .then(response => response.json())
    .then(data => {
      alert(data.message);

      if (data.success) {
        loadUsers();
      }
    });
}
  function deleteUser(id) {
  const ok = confirm("정말 이 회원을 삭제하시겠습니까?");

  if (!ok) {
    return;
  }

  fetch("/users/" + id, {
    method: "DELETE"
  })
    .then(response => response.json())
    .then(data => {
      alert(data.message);

      if (data.success) {
        loadAllUsers();
      }
    });
}

function addUser() {
  const school = document.getElementById("addSchool").value;
  const name = document.getElementById("addName").value;
  const user_class = document.getElementById("addClass").value;
  const user_id = document.getElementById("addUserId").value;
  const password = document.getElementById("addPassword").value;

  fetch("/users", {
    method: "POST",
    headers: {
      "Content-Type": "application/json"
    },
    body: JSON.stringify({
      school: school,
      name: name,
      user_class: user_class,
      user_id: user_id,
      password: password
    })
  })
    .then(response => response.json())
    .then(data => {
      alert(data.message);

      if (data.success) {
        document.getElementById("addSchool").value = "";
        document.getElementById("addName").value = "";
        document.getElementById("addUserId").value = "";
        document.getElementById("addPassword").value = "";

        loadUsers();
      }
    });
}

</script>

</body>
</html>
