<!DOCTYPE html>
<html>
<head>
  <title>선생님 관리 페이지</title>
  <meta charset="UTF-8">
  <link rel="stylesheet" href="main.css">
</head>
<body>

<header>
  <a href="yunsam.html">
    <img src="yunsam.jpeg" alt="img">
  </a>
</header>

<div class="navbar">
  <a href="teacher.html">회원 관리</a>
</div>

<div class="container">
  <div class="main">
    <h2>선생님 회원 관리 페이지</h2>
    <p>회원가입한 학생 정보를 확인할 수 있습니다.</p>
    <hr>

    <h3>회원가입 학생 목록</h3>

    <table border="1">
      <thead>
        <tr>
          <th>번호</th>
          <th>학교</th>
          <th>이름</th>
          <th>코드</th>
          <th>아이디</th>
          <th>관리</th>
        </tr>
      </thead>
      <tbody id="userList"></tbody>
    </table>
  </div>
</div>

<script>
  const loginUser = sessionStorage.getItem("loginUser");

  if (!loginUser) {
    alert("로그인이 필요합니다.");
    location.href = "login.html";
  } else {
    const user = JSON.parse(loginUser);

    if (user.role !== "teacher") {
      alert("관리자만 접근할 수 있습니다.");
      location.href = "yunsam.html";
    }
  }
  function loadUsers() {
    fetch("/users")
      .then(response => response.json())
      .then(data => {
        const userList = document.getElementById("userList");
        userList.innerHTML = "";

        if (!data.success) {
          alert(data.message);
          return;
        }

        data.users.forEach(user => {
          userList.innerHTML += `
            <tr>
              <td>${user.id}</td>
              <td>${user.school || ""}</td>
              <td>${user.name || ""}</td>
              <td>${user.code || ""}</td>
              <td>${user.user_id || ""}</td>
               <td>
                <button onclick="deleteUser(${user.id})">삭제</button>
              </td>
            </tr>
          `;
        });
      });
  }

  loadUsers();
  function deleteUser(id) {
  const ok = confirm("정말 이 회원을 삭제하시겠습니까?");

  if (!ok) {
    return;
  }

  fetch("/users/" + id, {
    method: "DELETE"
  })
    .then(response => response.json())
    .then(data => {
      alert(data.message);

      if (data.success) {
        loadUsers();
        loadNotices();
      }
    });
}
</script>

<hr>

<h2>공지사항 관리</h2>

<div class="notice-form">
  <input type="text" id="noticeTitle" placeholder="공지 제목">
  <br><br>
  <textarea id="noticeContent" placeholder="공지 내용" rows="5" cols="50"></textarea>
  <br><br>
  <button onclick="addNotice()">공지사항 등록</button>
</div>

<h3>등록된 공지사항</h3>

<table border="1">
  <thead>
    <tr>
      <th>번호</th>
      <th>제목</th>
      <th>내용</th>
      <th>삭제</th>
    </tr>
  </thead>
  <tbody id="noticeList"></tbody>
</table>
<script>
function loadNotices() {
  fetch("/notices")
    .then(response => response.json())
    .then(data => {
      const noticeList = document.getElementById("noticeList");
      noticeList.innerHTML = "";

      if (!data.success) {
        alert(data.message);
        return;
      }

      data.notices.forEach(notice => {
        noticeList.innerHTML += `
          <tr>
            <td>${notice.id}</td>
            <td>${notice.title}</td>
            <td>${notice.content}</td>
            <td>
              <button onclick="deleteNotice(${notice.id})">삭제</button>
            </td>
          </tr>
        `;
      });
    });
}

function addNotice() {
  const title = document.getElementById("noticeTitle").value;
  const content = document.getElementById("noticeContent").value;

  fetch("/notices", {
    method: "POST",
    headers: {
      "Content-Type": "application/json"
    },
    body: JSON.stringify({
      title: title,
      content: content
    })
  })
    .then(response => response.json())
    .then(data => {
      alert(data.message);

      if (data.success) {
        document.getElementById("noticeTitle").value = "";
        document.getElementById("noticeContent").value = "";
        loadNotices();
      }
    });
}

function deleteNotice(id) {
  const ok = confirm("정말 이 공지사항을 삭제하시겠습니까?");

  if (!ok) {
    return;
  }

  fetch("/notices/" + id, {
    method: "DELETE"
  })
    .then(response => response.json())
    .then(data => {
      alert(data.message);

      if (data.success) {
        loadNotices();
      }
    });
}
</script>
</body>
</html>
