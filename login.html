      <div class="gomiddle">
          <div><h1>윤쌤영어 홈페이지에 오신 것을 환영합니다.</h1></div>
              <a href="login.html">로그인</a>

      <div class="box">
          <form onsubmit="login(event)">
              <div><label>출석코드: </label><input type="text" id= "loginId" name="id"/></div>
              <div><label>비밀번호: </label><input type="password" id="loginPw" name="pw"/></div>
              <div class="button">
                  <input class="submit" type="submit" value="Login"/>
                  <input class="reset" type="reset" value="Cancel"/>
              </div>
          </form>
      </div>
  </div>

  <script>
    function login(event) {
      event.preventDefault();

      const user_id = document.getElementById("loginId").value;
      const password = document.getElementById("loginPw").value;

      fetch("/login", {
        method: "POST",
        headers: {
          "Content-Type": "application/json"
        },
        body: JSON.stringify({
          user_id: user_id,
          password: password
        })
      })
      .then(response => response.json())
      .then(data => {
        alert(data.message);

        if (data.success) {
          sessionStorage.setItem("loginUser", JSON.stringify(data.user));

          if (data.user.user_id === "teacher") {
            location.href = "teacher.html";
          } else {
            location.href = "yunsam.html";
          }
        }
      });
    }
  function login(event) {
    event.preventDefault();

    const user_id = document.getElementById("loginId").value;
    const password = document.getElementById("loginPw").value;

    fetch("/login", {
      method: "POST",
      headers: {
        "Content-Type": "application/json"
      },
      body: JSON.stringify({
        user_id: user_id,
        password: password
      })
    })
    .then(response => response.json())
    .then(data => {
      alert(data.message);

      if (data.success) {
        sessionStorage.setItem("loginUser", JSON.stringify(data.user));

        if (data.user.role === "teacher") {
          location.href = "teacher.html";
        } else {
          location.href = "yunsam.html";
        }
      }
    });
  }

  function changePassword(event) {
    event.preventDefault();

    const user_id = document.getElementById("changeUserId").value;
    const current_password = document.getElementById("currentPassword").value;
    const new_password = document.getElementById("newPassword").value;

    fetch("/change-password", {
      method: "PATCH",
      headers: {
        "Content-Type": "application/json"
      },
      body: JSON.stringify({
        user_id: user_id,
        current_password: current_password,
        new_password: new_password
      })
    })
    .then(response => response.json())
    .then(data => {
      alert(data.message);

      if (data.success) {
        document.getElementById("changeUserId").value = "";
        document.getElementById("currentPassword").value = "";
        document.getElementById("newPassword").value = "";
      }
    });
  }
</script>
