<body>
    <!-- Header -->
    <header>
    <a href="yunsam.html"> 
        <img src="yunsam.jpeg" alt="img">
    </a>

    <!-- Navigation Bar -->
    <div class="navbar">
    <a href="announce.html">공지사항</a>
    <a href="test.html">단어</a>
    <a href="daily.html">데일리 완성도</a>
    <a href="hw.html">숙제</a>

    <div class="nav-right">
        <a href="login.html">Login</a>
        <a href="yunsam.html">My Page</a>
    </div>
    </div>

    <div class="main">
        <div class="gomiddle">
            <div><h1>윤쌤영어 홈페이지에 오신 것을 환영합니다.</h1></div>
            
            <a href="login.html">로그인</a>
            | <a href="signup.html">회원가입</a>
        </div>

        <form onsubmit="signup(event)">
            <div class="box">
                <div><label>학교: </label><input type ="text" name="school" id="school" placeholder="김포고1" autofocus/></div>
                <div><label>이름: </label><input type="text" name="name" id="name"/></div>
                <div><label>출석코드: </label>
                    <input type="number" name="code" id="code" placeholder="0000" required/>
                </div>
                <div><label>아이디: </label><input type="text" name="id" id="id" required/></div>
                <div><label>비밀번호: </label><input type="password" name="pw" id="pw" required/></div>
            
                <div class="button">
                    <input class="submit" type="submit" value="Signup"/>
                    <input class="reset" type="reset" value="Cancel"/>
                </div>
            </div>
        </form>
        
    <script>
    function signup(event) {
        event.preventDefault();

        const school = document.getElementById("school").value;
        const name = document.getElementById("name").value;
        const code = document.getElementById("code").value;
        const user_id = document.getElementById("id").value;
        const password = document.getElementById("pw").value;

        fetch("/signup", {
        method: "POST",
        headers: {
            "Content-Type": "application/json"
        },
        body: JSON.stringify({
            school: school,
            name: name,
            code: code,
            user_id: user_id,
            password: password
        })
        })
        .then(response => response.json())
        .then(data => {
        alert(data.message);

        if (data.success) {
            location.href = "login.html";
        }
        });
    }
    </script>

    </div>

</body>
