<script>
function updateNavbar() {
  const navRight = document.getElementById("navRight");
  const loginUser = sessionStorage.getItem("loginUser");

  if (!navRight) {
    return;
  }

  if (loginUser) {
    navRight.innerHTML = `
      <a href="yunsam.html">My Page</a>
      <a href="#" onclick="logout()">Logout</a>
    `;
  } else {
    navRight.innerHTML = `
      <a href="login.html">Login</a>
      <a href="yunsam.html">My Page</a>
    `;
  }
}

function logout() {
  sessionStorage.removeItem("loginUser");
  alert("로그아웃되었습니다.");
  location.href = "login.html";
}

updateNavbar();

  function loadNotices(userClass) {
    fetch("/notices?class=" + encodeURIComponent(userClass))
      .then(response => response.json())
      .then(data => {
        const noticeBox = document.getElementById("noticeBox");
        noticeBox.innerHTML = "";

        if (!data.success) {
          noticeBox.innerHTML = "공지사항을 불러오지 못했습니다.";
          return;
        }

        if (data.notices.length === 0) {
          noticeBox.innerHTML = "등록된 공지사항이 없습니다.";
          return;
        }

        noticeBox.innerHTML = `<ul class="notice-list"></ul>`;

        const noticeList = noticeBox.querySelector(".notice-list");

        data.notices.forEach(notice => {
          noticeList.innerHTML += `
            <li>
              <strong>${notice.title}</strong>
              <span>${notice.content}</span>
            </li>
          `;
        });
      });
  }

</script>

<script>
  const loginUser = sessionStorage.getItem("loginUser");

  if (loginUser) {
    const user = JSON.parse(loginUser);

    document.getElementById("userName").textContent =
      user.school + " " + user.name;

    document.getElementById("userClass").textContent =
      user.user_class;
    
    const currentMonth = new Date().toISOString().slice(0, 7);

    loadMyHomeworks(user.user_class);
    loadNotices(user.user_class);
    loadMyRecords(user.user_id, user.user_class, currentMonth);
  } else {
    document.getElementById("userName").textContent =
      "로그인이 필요합니다";
  }

  function getWeeksByClass(className) {
    const twiceAWeekClasses = ["고1 주2회", "고2 주2회", "중3"];

    if (twiceAWeekClasses.includes(className)) {
      return [
        { key: "week1_1", label: "Week 1-1" },
        { key: "week1_2", label: "Week 1-2" },
        { key: "week2_1", label: "Week 2-1" },
        { key: "week2_2", label: "Week 2-2" },
        { key: "week3_1", label: "Week 3-1" },
        { key: "week3_2", label: "Week 3-2" },
        { key: "week4_1", label: "Week 4-1" },
        { key: "week4_2", label: "Week 4-2" }
      ];
    }

    return [
      { key: "week1", label: "Week 1" },
      { key: "week2", label: "Week 2" },
      { key: "week3", label: "Week 3" },
      { key: "week4", label: "Week 4" }
    ];
  }

  function loadMyRecords(user_id, user_class, recordMonth) {
    Promise.all([
      fetch(
        "/my-records/" + encodeURIComponent(user_id) +
        "?month=" + encodeURIComponent(recordMonth)
      ).then(response => response.json()),

      fetch(
        "/test-ranges?class=" + encodeURIComponent(user_class) +
        "&month=" + encodeURIComponent(recordMonth)
      ).then(response => response.json())
    ])
      .then(([recordData, rangeData]) => {
        if (!recordData.success) {
          showEmptyRecords("기록을 불러오지 못했습니다.");
          return;
        }

        const ranges = rangeData.success ? rangeData.ranges : [];
        showMyRecords(user_class, recordData.records, ranges);
      });
  }

  function showMyRecords(user_class, records, ranges) {
    const weeks = getWeeksByClass(user_class);

    const weekRow = document.getElementById("recordWeekRow");
    const rangeRow = document.getElementById("recordRangeRow");
    const attendanceRow = document.getElementById("recordAttendanceRow");
    const vocabRow = document.getElementById("recordVocabRow");

    weekRow.innerHTML = "<th>날짜</th>";
    rangeRow.innerHTML = "<th>범위</th>";
    attendanceRow.innerHTML = "<th>출결</th>";
    vocabRow.innerHTML = "<th>단어시험</th>";

    weeks.forEach(week => {
      const record = records.find(r => r.week === week.key);
      const range = ranges.find(r => r.week === week.key);

      weekRow.innerHTML += `<td>${week.label}</td>`;
      rangeRow.innerHTML += `<td>${range ? range.vocab_range : "-"}</td>`;
      attendanceRow.innerHTML += `<td>${record ? record.attendance || "-" : "-"}</td>`;
      vocabRow.innerHTML += `<td>${record ? record.vocab_result || "-" : "-"}</td>`;
    });
  }

  function showEmptyRecords(message) {
    const weekRow = document.getElementById("recordWeekRow");
    const rangeRow = document.getElementById("recordRangeRow");
    const attendanceRow = document.getElementById("recordAttendanceRow");
    const vocabRow = document.getElementById("recordVocabRow");

    weekRow.innerHTML = "<th>날짜</th><td>" + message + "</td>";
    rangeRow.innerHTML = "<th>범위</th><td>-</td>";
    attendanceRow.innerHTML = "<th>출결</th><td>-</td>";
    vocabRow.innerHTML = "<th>단어시험</th><td>-</td>";
  }

function loadMyHomeworks(userClass) {
  fetch("/homeworks?class=" + encodeURIComponent(userClass))
    .then(response => response.json())
    .then(data => {
      const list = document.getElementById("myHomeworkList");
      list.innerHTML = "";

      if (!data.success) {
        list.innerHTML = `
          <tr>
            <td colspan="3">숙제를 불러오지 못했습니다.</td>
          </tr>
        `;
        return;
      }

      if (data.homeworks.length === 0) {
        list.innerHTML = `
          <tr>
            <td colspan="3">등록된 숙제가 없습니다.</td>
          </tr>
        `;
        return;
      }

      const hw = data.homeworks[0];
      list.innerHTML += `
        <tr>
          <td>${hw.target_class === "all" ? "전체" : hw.target_class}</td>
          <td>${hw.title}</td>
          <td class ="homework-content">${hw.content}</td>
        </tr>
      `;
    });
}
</script>
