<!DOCTYPE html>
<html>
<head>
  <title>숙제 관리</title>
  <meta charset="UTF-8">
  <link rel="stylesheet" href="main.css">
</head>
<body>

<header>
  <img src="yunsam.jpeg" alt="img">
</header>

<div class="navbar">
  <a href="teacher.html">학생 인원 관리</a>
  <a href="teacher_hw.html">숙제 관리</a>
  <a href="teacher_announce.html">공지사항 관리</a>
  <a href="teacher_test.html">시험 관리</a>
</div>

<div class="container">
  <div class="main">
    <h2>숙제 관리</h2>

    <h3>대상 반</h3>

    <label><input type="checkbox" name="hwClass" value="고3"> 고3</label>
    <label><input type="checkbox" name="hwClass" value="고2 주2회"> 고2 주2회</label>
    <label><input type="checkbox" name="hwClass" value="고2 주1회"> 고2 주1회</label>
    <label><input type="checkbox" name="hwClass" value="고1 주2회"> 고1 주2회</label>
    <label><input type="checkbox" name="hwClass" value="고1 주1회"> 고1 주1회</label>
    <label><input type="checkbox" name="hwClass" value="중3"> 중3</label>

    <br><br>

    <input type="text" id="hwTitle" placeholder="숙제 제목">
    <br><br>

    <textarea id="hwContent" rows="5" cols="50" placeholder="숙제 내용"></textarea>
    <br><br>

    <button onclick="addHomework()">숙제 등록</button>

    <h3>등록된 숙제</h3>

    <table border="1">
      <thead>
        <tr>
          <th>번호</th>
          <th>반</th>
          <th>날짜</th>
          <th>내용</th>
          <th>삭제</th>
        </tr>
      </thead>
      <tbody id="homeworkList"></tbody>
    </table>
  </div>
</div>

<script>
  const loginUser = sessionStorage.getItem("loginUser");

  if (!loginUser) {
    alert("로그인이 필요합니다.");
    location.href = "login.html";
  } else {
    const user = JSON.parse(loginUser);

    if (user.role !== "teacher") {
      alert("관리자만 접근할 수 있습니다.");
      location.href = "yunsam.html";
    }
  }

  function loadHomeworks() {
    fetch("/homeworks")
      .then(response => response.json())
      .then(data => {
        const homeworkList = document.getElementById("homeworkList");
        homeworkList.innerHTML = "";

        if (!data.success) {
          alert(data.message);
          return;
        }

        data.homeworks.forEach(hw => {
          homeworkList.innerHTML += `
            <tr>
              <td>${hw.id}</td>
              <td>${hw.target_class}</td>
              <td>${hw.title}</td>
              <td>${hw.content}</td>
              <td>
                <button onclick="deleteHomework(${hw.id})">삭제</button>
              </td>
            </tr>
          `;
        });
      });
  }

  function addHomework() {
    const title = document.getElementById("hwTitle").value;
    const content = document.getElementById("hwContent").value;

    const checkedClasses = document.querySelectorAll('input[name="hwClass"]:checked');

    let target_classes = [];

    checkedClasses.forEach(item => {
      target_classes.push(item.value);
    });

    if (target_classes.includes("all")) {
      target_classes = ["all"];
    }

    fetch("/homeworks", {
      method: "POST",
      headers: {
        "Content-Type": "application/json"
      },
      body: JSON.stringify({
        title,
        content,
        target_classes
      })
    })
      .then(response => response.json())
      .then(data => {
        alert(data.message);

        if (data.success) {
          document.getElementById("hwTitle").value = "";
          document.getElementById("hwContent").value = "";

          checkedClasses.forEach(item => {
            item.checked = false;
          });

          loadHomeworks();
        }
      });
  }

  function deleteHomework(id) {
    if (!confirm("정말 이 숙제를 삭제하시겠습니까?")) {
      return;
    }

    fetch("/homeworks/" + id, {
      method: "DELETE"
    })
      .then(response => response.json())
      .then(data => {
        alert(data.message);

        if (data.success) {
          loadHomeworks();
        }
      });
  }

  loadHomeworks();
</script>

</body>
</html>
